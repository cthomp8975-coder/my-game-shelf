<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#2d4a3e"/>
  
  <!-- Shelf board (bottom) -->
  <rect x="48" y="360" width="416" height="28" rx="6" fill="#c9a84c"/>
  <!-- Shelf board (middle) -->
  <rect x="48" y="220" width="416" height="22" rx="6" fill="#c9a84c"/>
  
  <!-- Left bracket -->
  <rect x="60" y="100" width="18" height="290" rx="6" fill="#c9a84c" opacity="0.6"/>
  <!-- Right bracket -->
  <rect x="434" y="100" width="18" height="290" rx="6" fill="#c9a84c" opacity="0.6"/>

  <!-- === BOTTOM SHELF BOOKS === -->
  <!-- Book 1 - tall red -->
  <rect x="90" y="270" width="34" height="90" rx="4" fill="#c0392b"/>
  <rect x="90" y="270" width="34" height="10" rx="4" fill="#a93226"/>
  <!-- Book 2 - medium teal -->
  <rect x="132" y="290" width="28" height="70" rx="4" fill="#1a7a6e"/>
  <!-- Book 3 - wide gold -->
  <rect x="168" y="280" width="44" height="80" rx="4" fill="#c9a84c"/>
  <rect x="168" y="280" width="44" height="8" rx="4" fill="#b8962a"/>
  <!-- Book 4 - slim purple -->
  <rect x="220" y="295" width="22" height="65" rx="4" fill="#7c5cbf"/>
  <!-- Book 5 - medium green -->
  <rect x="250" y="285" width="32" height="75" rx="4" fill="#2d7a4f"/>
  <!-- Book 6 - tall cream -->
  <rect x="290" y="268" width="30" height="92" rx="4" fill="#f5e9c8"/>
  <rect x="290" y="268" width="30" height="9" rx="4" fill="#e8d5a0"/>
  <!-- Book 7 - medium rust -->
  <rect x="328" y="278" width="36" height="82" rx="4" fill="#c0652b"/>
  <!-- Book 8 - slim navy -->
  <rect x="372" y="292" width="24" height="68" rx="4" fill="#2c3e6b"/>
  <!-- Book 9 - wide sage -->
  <rect x="404" y="282" width="32" height="78" rx="4" fill="#5a8a6a"/>

  <!-- === TOP SHELF - DICE === -->
  <!-- Dice body -->
  <rect x="148" y="128" width="100" height="100" rx="16" fill="#f5e9c8"/>
  <rect x="148" y="128" width="100" height="100" rx="16" fill="none" stroke="#c9a84c" stroke-width="4"/>
  <!-- Dice dots - 5 face -->
  <circle cx="178" cy="155" r="9" fill="#2d4a3e"/>
  <circle cx="218" cy="155" r="9" fill="#2d4a3e"/>
  <circle cx="198" cy="178" r="9" fill="#2d4a3e"/>
  <circle cx="178" cy="201" r="9" fill="#2d4a3e"/>
  <circle cx="218" cy="201" r="9" fill="#2d4a3e"/>

  <!-- Second dice (overlapping, rotated look) -->
  <rect x="264" y="118" width="100" height="100" rx="16" fill="#c9a84c"/>
  <rect x="264" y="118" width="100" height="100" rx="16" fill="none" stroke="#b8962a" stroke-width="4"/>
  <!-- Dice dots - 3 face -->
  <circle cx="290" cy="144" r="9" fill="#2d4a3e"/>
  <circle cx="314" cy="168" r="9" fill="#2d4a3e"/>
  <circle cx="338" cy="192" r="9" fill="#2d4a3e"/>
</svg>
